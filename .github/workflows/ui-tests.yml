name: UI Reconstruction

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    name: ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          install-dev: "true"

      - name: Run UI Reconstruction & Visual Hierarchy Tests
        run: |
          python -m pytest tests/test_phase4.py \
                           tests/test_phase13a.py \
                           tests/test_phase13b1.py \
                           tests/test_phase13b2.py \
                           tests/test_pre_phase11.py \
                           -k "ui" \
                           --junitxml=reports/ui-test-results.xml

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: reports/
          retention-days: 7
