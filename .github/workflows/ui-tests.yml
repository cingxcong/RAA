name: UI Reconstruction

on:
  push:
    branches:
      - main
      - feature
      - 'bugfix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    name: ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          install-dev: "true"

      - name: Run UI Reconstruction & Visual Hierarchy Tests
        run: |
          python -m pytest tests/test_phase4.py \
                           tests/test_phase13a.py \
                           tests/test_phase13b1.py \
                           tests/test_phase13b2.py \
                           tests/test_pre_phase11.py \
                           -k "ui" \
                           --junitxml=reports/ui-test-results.xml

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ui-test-results
          path: reports/
          retention-days: 7
